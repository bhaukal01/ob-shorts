[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge"
version = "0.1.0"
description = "CLI for ClipForge: clip long videos into vertical shorts and publish them, from the terminal"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ClipForge" }]
keywords = ["video", "clips", "shorts", "ai", "tiktok", "youtube-shorts", "cli"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://www.clipforge.studio"
Source = "https://github.com/mutonby/clipforge"
Documentation = "https://www.clipforge.studio/mcp"

[project.scripts]
clipforge = "clipforge_cli:main"

[tool.setuptools]
py-modules = ["clipforge_cli"]
