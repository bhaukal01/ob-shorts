<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo-openshorts.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="color-scheme" content="dark" />
  <link rel="stylesheet" href="/fonts.css" />
  <title>OpenShorts - AI Video Clipper</title>
</head>

<body style="background-color: #0b0d12; margin: 0; padding: 0;">
  <div id="root">
    <div style="min-height: 100vh; background-color: #0b0d12; display: flex; align-items: center; justify-content: center; color: #64748b; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 14px;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
        <div style="width: 24px; height: 24px; border: 2px solid rgba(255,255,255,0.1); border-top-color: #f59e0b; border-radius: 50%; animation: os-spin 0.8s linear infinite;"></div>
        <style>@keyframes os-spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
