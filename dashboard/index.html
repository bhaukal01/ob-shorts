<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M8 10h16M8 16h11M8 22h14' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='23' cy='16' r='3' fill='%2310b981'/%3E%3C/svg%3E" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f17" id="theme-color-meta" />
  <title>ClipForge Studio — AI Video Clipper &amp; Auto-Publishing</title>
  <meta name="description" content="High-performance video intelligence workspace that transforms streams and long-form video into viral clips." />

  <!-- Typography: Plus Jakarta Sans (Professionally Casual) & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/fonts.css" />

  <!-- Anti-flash script: apply dark/light theme before paint -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('clipforge_theme') || 'system';
        var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) {}
    })();
  </script>
</head>

<body class="bg-paper text-ink transition-colors duration-200">
  <div id="root">
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 14px;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 14px;">
        <div style="width: 28px; height: 28px; border: 2.5px solid rgba(37,99,235,0.2); border-top-color: #2563eb; border-radius: 50%; animation: cf-spin 0.7s linear infinite;"></div>
        <span style="letter-spacing: 0.05em; font-size: 11px; text-transform: uppercase; opacity: 0.7; font-weight: 600;">Loading ClipForge...</span>
        <style>@keyframes cf-spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
