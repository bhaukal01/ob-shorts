<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23111111'/%3E%3Cpath d='M10 18V13a3 3 0 0 1 3-3h5' stroke='white' stroke-width='3.5' stroke-linecap='round' fill='none'/%3E%3Cpath d='M22 10h5a3 3 0 0 1 3 3v5' stroke='%23FF5A1F' stroke-width='3.5' stroke-linecap='round' fill='none'/%3E%3Cpath d='M30 22v5a3 3 0 0 1-3 3h-5' stroke='white' stroke-width='3.5' stroke-linecap='round' fill='none'/%3E%3Cpath d='M18 30h-5a3 3 0 0 1-3-3v-5' stroke='white' stroke-width='3.5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f15" id="theme-color-meta" />
  <title>ClipSnipr — Automatic AI Clipping Tool</title>
  <meta name="description" content="Automatic AI video clipping tool for streams, gaming, podcasts, and social shorts." />

  <!-- Typography: Inter (Brand Standard) & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/fonts.css" />

  <!-- Anti-flash script: apply dark/light theme before paint -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('clipsnipr_theme') || 'system';
        var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) {}
    })();
  </script>
</head>

<body class="bg-paper text-ink transition-colors duration-150">
  <div id="root">
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', system-ui, sans-serif; font-size: 14px; background: #0b0f15; color: #f8fafc;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 14px;">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="40" height="40" rx="10" fill="#111111"/>
          <path d="M10 18V13a3 3 0 0 1 3-3h5" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M22 10h5a3 3 0 0 1 3 3v5" stroke="#FF5A1F" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M30 22v5a3 3 0 0 1-3 3h-5" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M18 30h-5a3 3 0 0 1-3-3v-5" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
        <span style="letter-spacing: 0.08em; font-size: 11px; text-transform: uppercase; opacity: 0.8; font-weight: 600;">Loading ClipSnipr...</span>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
