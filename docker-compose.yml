services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - CLIP_WORKERS=3
      - DETECT_STRIDE=6
      - SCENE_ENGINE=pyscenedetect
      - FFMPEG_THREADS=3
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - MKL_NUM_THREADS=2
    env_file:
      - path: .env
        required: false
    volumes:
      - openshorts_data:/app/data
      - openshorts_output:/app/output
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      target: prod
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    ports:
      - "${RENDERER_PORT:-3100}:3100"
    volumes:
      - openshorts_output:/output
    env_file:
      - path: .env
        required: false
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
      - REMOTION_CONCURRENCY=2
      - REMOTION_IMAGE_FORMAT=jpeg
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  openshorts_data:
  openshorts_output:
