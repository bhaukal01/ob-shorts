services:
  backend:
    build: .
    container_name: openshorts-backend
    ports:
      - "8000:8000"
    environment:
      - CLIP_WORKERS=3
      - DETECT_STRIDE=6
      - SCENE_ENGINE=pyscenedetect
      - FFMPEG_THREADS=3
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - MKL_NUM_THREADS=2
    volumes:
      - .:/app
      - /app/__pycache__
      - ./output:/app/output
      - openshorts_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      target: dev
    container_name: openshorts-frontend
    ports:
      - "5175:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: openshorts-renderer
    ports:
      - "3100:3100"
    volumes:
      - ./output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
      - REMOTION_CONCURRENCY=2
      - REMOTION_IMAGE_FORMAT=jpeg
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  openshorts_data:
