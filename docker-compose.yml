services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - CLIP_WORKERS=3
      - DETECT_STRIDE=6
      - SCENE_ENGINE=pyscenedetect
      - FFMPEG_THREADS=3
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - WHISPER_BEAM_SIZE=1
      - WHISPER_THREADS=4
    env_file:
      - path: .env
        required: false
    volumes:
      - clipsnipr_data:/app/data
      - clipsnipr_output:/app/output
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      target: prod
    expose:
      - "80"
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    expose:
      - "3100"
    volumes:
      - clipsnipr_output:/output
    env_file:
      - path: .env
        required: false
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
      - REMOTION_CONCURRENCY=2
      - REMOTION_IMAGE_FORMAT=jpeg
    restart: unless-stopped
    depends_on:
      - backend

  # Optional dedicated YouTube bypass sidecar (Cobalt):
  # To enable, uncomment below and set COBALT_API_URL=http://cobalt:9000 in .env or Settings
  # cobalt:
  #   image: ghcr.io/imputnet/cobalt:10
  #   restart: unless-stopped
  #   environment:
  #     - API_URL=http://cobalt:9000
  #   ports:
  #     - "9000:9000"

volumes:
  clipsnipr_data:
  clipsnipr_output:
