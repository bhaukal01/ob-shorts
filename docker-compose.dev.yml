services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clipsnipr-backend-dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/__pycache__
      - ./output:/app/output
      - ./data:/app/data
    environment:
      - CLIP_WORKERS=3
      - DETECT_STRIDE=6
      - SCENE_ENGINE=pyscenedetect
      - FFMPEG_THREADS=3
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      target: dev
    container_name: clipsnipr-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: clipsnipr-renderer-dev
    ports:
      - "3100:3100"
    volumes:
      - ./output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: unless-stopped
    depends_on:
      - backend

